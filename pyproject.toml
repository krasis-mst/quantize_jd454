[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "krasis-mst-quantize_jd454"
version = "0.1.0"
description = "按段落统计量化与稀疏化研究员·提示注入的跨轮传播相关的长度分布，标出过长、过短与重复表达的部分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "krasis-mst" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://krasis-mst.github.io"
Repository = "https://github.com/krasis-mst/quantize_jd454"
Issues = "https://github.com/krasis-mst/quantize_jd454/issues"

[project.scripts]
quantize_jd454 = "quantize_jd454:main"

[tool.setuptools]
py-modules = ["quantize_jd454"]
